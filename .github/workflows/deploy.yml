name: Deploy to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json\nworker/package-lock.json" }
      - run: npm ci
      - run: npm --prefix worker/engine ci && npm --prefix worker ci
      - name: Build, test, migrate, deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy.mjs --origin "${{ vars.PUBLIC_ORIGIN || 'https://dyadryn.siteborne-production-system.workers.dev' }}"
