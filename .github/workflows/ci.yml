name: CI
on: [push, pull_request]
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix worker/engine ci && npm --prefix worker ci
      - run: npm --prefix worker run lint
      - run: npm --prefix worker run test:engine
      - run: npm --prefix worker test
